[versions]
# Toolchain. AGP is held on the 8.x line deliberately: AGP 9 forbids the Kotlin Multiplatform
# plugin and the Android application plugin in the same Gradle subproject, which would split
# composeApp in two. See docs/M0_PLAN.md.
agp = "8.13.2"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
googleServices = "4.6.0"

android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

# Shared libraries
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
ktor = "3.5.1"
koin = "4.2.2"
sqldelight = "2.4.1"

# Android-only
# Held back deliberately: 1.13.0 requires AGP 9.1+, and this project is on the AGP 8.x line.
androidx-activity = "1.10.1"
# Same reason as androidx-activity: 1.19.0 requires AGP 9.1+ and compileSdk 37.
androidx-core = "1.16.0"
androidx-security-crypto = "1.1.0"
# WorkManager is the NET under AlarmManager, not a replacement for it: it cannot express an
# exact time, and a 09:00 reminder arriving at 14:00 is the failure M2 exists to prevent.
# Its job is to re-arm alarms a force-stop or a reboot destroyed. See docs/M2_PLAN.md §5.
androidx-work = "2.10.1"
androidx-credentials = "1.6.0"
googleid = "1.2.1"
firebase-bom = "35.2.0"

# Navigation 3. The hand-rolled `when` over a StateFlow on an Application-scoped singleton
# could not express two panes at once (FR-VIEW-06), did not survive process death
# (FR-VIEW-07), and had no per-destination history for M4's four top-level views. Stable
# releases, and KMP-published including iosArm64, which this project needs because it keeps
# the iOS target compiling. See docs/M4_PLAN.md §2.
nav3 = "1.2.0"
nav3Core = "1.2.2"

# Material 3 Adaptive, held at 1.2.0 ON PURPOSE. The 1.3.0 line — which is the first to
# publish `adaptive-navigation3`, the ready-made list-detail Scene for Navigation 3 —
# requires AGP 9.1 and compileSdk 37, and AGP is held on the 8.x line because AGP 9 forbids
# the Kotlin Multiplatform plugin and the Android application plugin in one subproject.
# So the two-pane Scene is written here instead. docs/M4_PLAN.md §2.4.
adaptive = "1.2.0"

# Test
turbine = "1.2.1"

# Instrumented tests. FR-VIEW-07 wants explicit state-restoration tests and definition-of-
# done item 5 says automated, not only a device walkthrough. These need a real device or
# emulator, so they are a LOCAL gate: CI has neither and still runs unit tests only.
# androidx-compose-ui is pinned to what the Compose Multiplatform 1.11.1 plugin already
# resolves (1.11.2) — a newer ui-test line wants compileSdk 37, which this project cannot
# take. See docs/M4_PLAN.md §2.4 and §4.
androidx-compose-ui = "1.11.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
# ui-test-junit4 drags in espresso-core 3.5.0, which calls android.hardware.input.
# InputManager.getInstance — removed in recent Android, so every instrumented test died with
# NoSuchMethodException on the Pixel 9a before a single assertion ran. 3.7.0 is the fix.
androidx-espresso = "3.7.0"

[libraries]
# --- shared ---
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
compose-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
compose-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
# Test-only. Module.verify() checks every constructor dependency against the declared
# definitions WITHOUT instantiating anything — which is the one class of bug that compiles,
# passes every unit test, and then throws on the first launch.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# JVM driver, TEST ONLY. It is what lets a unit test stand up a real in-memory SQLite and
# drive LocalStore for real — the seam where M3 found the derived-values bug, and which until
# now could only be tested through hand-written fakes that cannot disagree with the database.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }


# --- android ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# --- test ---
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
